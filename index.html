<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spatial Intercept Core v42.0</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
        body { background-color: #09090b; color: #f4f4f5; display: flex; height: 100vh; overflow: hidden; }
        #controlDeck { width: 360px; background-color: #18181b; border-right: 1px solid #27272a; display: flex; flex-direction: column; padding: 16px; }
        #map { flex-grow: 1; height: 100%; background: #09090b; position: relative; }
        .deck-title { font-size: 14px; font-weight: bold; color: #e11d48; margin-bottom: 12px; letter-spacing: 1px; }
        .search-container { display: flex; gap: 8px; margin-bottom: 16px; }
        input { flex-grow: 1; background: #09090b; border: 1px solid #27272a; padding: 8px; color: #f4f4f5; font-size: 12px; outline: none; }
        input:focus { border-color: #e11d48; }
        button { background: #e11d48; color: white; border: none; padding: 8px 16px; font-size: 12px; cursor: pointer; font-weight: bold; }
        button:hover { background: #be123c; }
        #telemetryOutput { flex-grow: 1; overflow-y: auto; background: #09090b; border: 1px solid #27272a; padding: 12px; margin-bottom: 8px; }
        #zoomMonitor { background: #09090b; border: 1px solid #27272a; border-bottom: none; padding: 8px 12px; font-size: 11px; font-weight: bold; display: flex; justify-content: space-between; }
        #debugWindow { height: 120px; background: #000; border: 1px solid #27272a; padding: 8px; font-size: 10px; color: #22c55e; overflow-y: auto; white-space: pre-wrap; }
        .location-card { border-left: 2px solid #e11d48; padding-left: 8px; margin-bottom: 8px; }
        .leaflet-control-layers { background: #18181b !important; color: #f4f4f5 !important; border: 1px solid #27272a !important; font-family: monospace !important; font-size: 11px !important; }
    </style>
</head>
<body>

    <div id="controlDeck">
        <div class="deck-title">// SPATIAL INTERCEPT v42</div>
        
        <form class="search-container" onsubmit="executeDirectGeocode(event)">
            <input type="text" id="targetQuery" placeholder="Enter postcode or town..." autocomplete="off">
            <button type="submit">SEEK</button>
        </form>
        
        <div id="telemetryOutput">
            <p style="font-size: 11px; color: #71717a;">INSPIRE Index Polygons database linked. Toggle property limits inside the right layer deck.</p>
        </div>
        
        <div id="zoomMonitor">
            <span style="color: #71717a;">MAP ZOOM TELEMETRY:</span>
            <span id="zoomValue" style="color: #e11d48;">Z-LVL --</span>
        </div>
        
        <div id="debugWindow">[SYSTEM ONLINE] Land Registry WMS pipeline active.</div>
    </div>

    <div id="map"></div>

    <script>
        function logToTerminal(msg) {
            const logger = document.getElementById('debugWindow');
            if (logger) {
                const time = new Date().toISOString().split('T')[1].slice(0, 8);
                logger.innerText += `\n${time} [CLIENT] ${msg}`;
                logger.scrollTop = logger.scrollHeight;
            }
        }

        // =========================================================
        // INSERT YOUR MAPTILER API KEY IN THE QUOTES BELOW:
        const MAPTILER_KEY = "41KUQvskhR2L4HcfW4Ua";
        // =========================================================

        // --- 1. BASE STREET MAPS & MODERN SATELLITE ---
        const modernOSM = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { 
            maxZoom: 19, attribution: '© OpenStreetMap contributors'
        });

        const modernSatellite = L.tileLayer(`https://api.maptiler.com/tiles/satellite-hybrid/{z}/{x}/{y}.jpg?key=${MAPTILER_KEY}`, {
            maxZoom: 22, attribution: '© MapTiler © Maxar'
        });

        const mapTilerOS = L.tileLayer(`https://api.maptiler.com/maps/uk-openzoomstack-leisure/{z}/{x}/{y}.png?key=${MAPTILER_KEY}`, {
            maxZoom: 19, attribution: 'Contains OS data © Crown copyright'
        });

        // --- 2. HISTORIC AERIAL IMAGERY ARCHIVE ---
        const historicAerial1940s = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19, attribution: 'Historic Imagery Archive Data'
        });

        // --- 3. HISTORICAL MAP LAYERS ---
        const nlsMultiScale = L.tileLayer(`https://api.maptiler.com/tiles/uk-osgb1888/{z}/{x}/{y}.jpg?key=${MAPTILER_KEY}`, {
            minZoom: 1, maxZoom: 18, tileSize: 512, zoomOffset: -1, crossOrigin: true, attribution: '© NLS / MapTiler'
        });

        const nlsSixInch = L.tileLayer(`https://api.maptiler.com/tiles/uk-osgb10k1888/{z}/{x}/{y}.jpg?key=${MAPTILER_KEY}`, {
            minZoom: 6, maxZoom: 18, tileSize: 512, zoomOffset: -1, crossOrigin: true, attribution: '© NLS / MapTiler'
        });

        const nlsHills = L.tileLayer(`https://api.maptiler.com/tiles/uk-osgb63k1885/{z}/{x}/{y}.png?key=${MAPTILER_KEY}`, {
            minZoom: 1, maxZoom: 18, tileSize: 512, zoomOffset: -1, crossOrigin: true, attribution: '© NLS / MapTiler'
        });

        const nlsLondonFiveFoot = L.tileLayer(`https://api.maptiler.com/tiles/uk-oslondon1k1893/{z}/{x}/{y}.jpg?key=${MAPTILER_KEY}`, {
            minZoom: 6, maxZoom: 18, tileSize: 512, zoomOffset: -1, crossOrigin: true, attribution: '© NLS / MapTiler'
        });

        const nlsInterwar = L.tileLayer(`https://api.maptiler.com/tiles/uk-osgb10k1919/{z}/{x}/{y}.jpg?key=${MAPTILER_KEY}`, {
            minZoom: 6, maxZoom: 18, tileSize: 512, zoomOffset: -1, crossOrigin: true, attribution: '© NLS / MapTiler'
        });

        const nlsProvisional = L.tileLayer(`https://api.maptiler.com/tiles/uk-osgb25k1937/{z}/{x}/{y}.jpg?key=${MAPTILER_KEY}`, {
            minZoom: 1, maxZoom: 18, tileSize: 512, zoomOffset: -1, crossOrigin: true, attribution: '© NLS / MapTiler'
        });

        const nlsPostWar = L.tileLayer(`https://api.maptiler.com/tiles/uk-osgb63k1955/{z}/{x}/{y}.jpg?key=${MAPTILER_KEY}`, {
            minZoom: 1, maxZoom: 18, tileSize: 512, zoomOffset: -1, crossOrigin: true, attribution: '© NLS / MapTiler'
        });

        // --- 4. HM LAND REGISTRY INSPIRE GEOSPATIAL WMS STREAM ---
        // Note: The Land Registry WMS only renders vectors when zoomed in close (typically Zoom Level 15+)
        const landRegistryINSPIRE = L.tileLayer.wms('https://inspire.landregistry.gov.uk/inspire/ows', {
            layers: 'INSPIREIndexPolygons',
            format: 'image/png',
            transparent: true,
            version: '1.3.0',
            attribution: 'Contains HM Land Registry data © Crown copyright'
        });

        // --- 5. MAP INITIALIZATION ENGINE ---
        const map = L.map('map', {
            center: [50.26055, -5.05336], 
            zoom: 14, 
            layers: [modernOSM, landRegistryINSPIRE] // Loaded as a default overlay active layer
        });
        
        let activeMarker = null;

        // --- 6. COMPREHENSIVE LAYER CONTROL PANEL ---
        const baseMaps = {
            "Modern Street Map (OSM)": modernOSM,
            "Modern High-Res Satellite": modernSatellite,
            "Modern Ordnance Survey Grid": mapTilerOS,
            "Historical Aerial Base (1940s Frame)": historicAerial1940s,
            "NLS Dynamic Multi-Scale (1900s)": nlsMultiScale,
            "NLS Victorian Six-Inch (1888-1913)": nlsSixInch,
            "NLS One-Inch Hills Edition (1885)": nlsHills,
            "NLS London Ultra-Detail (1893)": nlsLondonFiveFoot,
            "NLS Interwar Complete (1919-1947)": nlsInterwar,
            "NLS Provisional 1:25k (1937-1961)": nlsProvisional,
            "NLS Post-War 7th Series (1955)": nlsPostWar
        };

        const overlayMaps = {
            "HMLR INSPIRE Boundaries": landRegistryINSPIRE
        };

        L.control.layers(baseMaps, overlayMaps, { collapsed: false }).addTo(map);

        // --- 7. TELEMETRY MONITOR SYSTEM ---
        function updateZoomMonitor() {
            const currentZoom = map.getZoom();
            const zoomDisplay = document.getElementById('zoomValue');
            if (zoomDisplay) {
                zoomDisplay.innerHTML = `Z-LVL ${currentZoom}`;
            }
            // Warning prompt inside log terminal to guide map views
            if (currentZoom < 15 && map.hasLayer(landRegistryINSPIRE)) {
                logToTerminal("INSPIRE Warning: Zoom level too low. Zoom to Z-LVL 15+ to view boundary shapes.");
            }
        }
        map.on('zoomend', updateZoomMonitor);
        map.on('moveend', updateZoomMonitor);
        updateZoomMonitor();

        // --- 8. DIRECT SEARCH SELECTION ---
        async function executeDirectGeocode(event) {
            if (event) event.preventDefault();

            const query = document.getElementById('targetQuery').value.trim();
            if (!query) return;

            logToTerminal(`Initiating geocode sweep for: "${query}"`);
            const sidebar = document.getElementById('telemetryOutput');
            sidebar.innerHTML = '<p style="font-size: 11px; color: #71717a; margin-top: 8px;">Contacting geocoding registry...</p>';

            try {
                const response = await fetch(
                    `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=gb`,
                    { headers: { 'User-Agent': 'SpatialInterceptPlatform_' + Math.floor(Math.random() * 100000) } }
                );
                
                const data = await response.json();

                if (!data || !Array.isArray(data) || data.length === 0) {
                    logToTerminal("FAILED: Location signature dropped out of registry.");
                    sidebar.innerHTML = '<p style="font-size: 11px; color: #e11d48; margin-top: 8px;">Location Not Found.</p>';
                    return;
                }

                const target = data[0];
                let lat = parseFloat(target.lat);
                let lon = parseFloat(target.lon);

                if (isNaN(lat) || isNaN(lon)) {
                    logToTerminal("ERROR: String coordinate conversion returned NaN values.");
                    sidebar.innerHTML = '<p style="font-size: 11px; color: #e11d48; margin-top: 8px;">Parsing Exception.</p>';
                    return;
                }

                logToTerminal(`SUCCESS: Target coordinated at: ${lat.toFixed(5)}, ${lon.toFixed(5)}`);
                map.setView([lat, lon], 16); // Sets standard entry zoom directly to 16 so boundaries load instantly

                if (activeMarker) map.removeLayer(activeMarker);
                activeMarker = L.marker([lat, lon]).addTo(map);

                sidebar.innerHTML = `
                    <div class="location-card">
                        <strong style="color: #e11d48; font-size: 11px;">[NODE RESOLVED]</strong>
                        <p style="margin: 6px 0; color: #f4f4f5; font-size: 11px;">${target.display_name}</p>
                        <span style="color: #71717a; font-size: 11px;">Lat/Lon: ${lat.toFixed(5)}, ${lon.toFixed(5)}</span>
                    </div>
                `;

            } catch (err) {
                logToTerminal(`System Intercept Error: ${err.message}`);
                sidebar.innerHTML = '<p style="font-size: 11px; color: #e11d48; margin-top: 8px;">Stream Exception Error</p>';
            }
        }
    </script>
</body>
</html>
