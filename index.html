<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spatial Intercept Core v26.0</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
        body { background-color: #09090b; color: #f4f4f5; display: flex; height: 100vh; overflow: hidden; }
        #controlDeck { width: 360px; background-color: #18181b; border-right: 1px solid #27272a; display: flex; flex-direction: column; padding: 16px; }
        #map { flex-grow: 1; height: 100%; background: #09090b; position: relative; }
        .deck-title { font-size: 14px; font-weight: bold; color: #e11d48; margin-bottom: 12px; letter-spacing: 1px; }
        .search-container { display: flex; gap: 8px; margin-bottom: 16px; }
        input { flex-grow: 1; background: #09090b; border: 1px solid #27272a; padding: 8px; color: #f4f4f5; font-size: 12px; outline: none; }
        input:focus { border-color: #e11d48; }
        button { background: #e11d48; color: white; border: none; padding: 8px 16px; font-size: 12px; cursor: pointer; font-weight: bold; }
        button:hover { background: #be123c; }
        #telemetryOutput { flex-grow: 1; overflow-y: auto; background: #09090b; border: 1px solid #27272a; padding: 12px; margin-bottom: 8px; }
        #zoomMonitor { background: #09090b; border: 1px solid #27272a; border-bottom: none; padding: 8px 12px; font-size: 11px; font-weight: bold; display: flex; justify-content: space-between; }
        #debugWindow { height: 120px; background: #000; border: 1px solid #27272a; padding: 8px; font-size: 10px; color: #22c55e; overflow-y: auto; white-space: pre-wrap; }
        .location-card { border-left: 2px solid #e11d48; padding-left: 8px; margin-bottom: 8px; }
        .leaflet-control-layers { background: #18181b !important; color: #f4f4f5 !important; border: 1px solid #27272a !important; font-family: monospace !important; font-size: 11px !important; }
    </style>
</head>
<body>

    <div id="controlDeck">
        <div class="deck-title">// SPATIAL INTERCEPT v26</div>
        <div class="search-container">
            <input type="text" id="targetQuery" placeholder="Enter postcode or town..." onkeydown="if(event.key==='Enter') executeDirectGeocode()">
            <button onclick="executeDirectGeocode()">SEEK</button>
        </div>
        
        <div id="telemetryOutput">
            <p style="font-size: 11px; color: #71717a;">Historical map archive array expanded.</p>
        </div>
        
        <div id="zoomMonitor">
            <span style="color: #71717a;">MAP ZOOM TELEMETRY:</span>
            <span id="zoomValue" style="color: #e11d48;">Z-LVL --</span>
        </div>
        
        <div id="debugWindow">[SYSTEM READY] V26 Historical Map Stack Operational.</div>
    </div>

    <div id="map"></div>

    <script>
        function logToTerminal(msg) {
            const logger = document.getElementById('debugWindow');
            if (logger) {
                const time = new Date().toISOString().split('T').slice(0, 8);
                logger.innerText += `\n${time} [CLIENT] ${msg}`;
                logger.scrollTop = logger.scrollHeight;
            }
        }

        // =========================================================
        // INSERT YOUR MAPTILER API KEY IN THE QUOTES BELOW:
        const MAPTILER_KEY = "41KUQvskhR2L4HcfW4Ua";
        // =========================================================

        // --- 1. CORE STREET MAP LAYER ---
        const modernOSM = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { 
            maxZoom: 19, 
            attribution: '© OpenStreetMap contributors'
        });

        // --- 2. EXPANDED NLS HISTORICAL MAP STACK ---
        // Victorian / Edwardian Era
        const nlsVictorian = L.tileLayer(`https://api.maptiler.com/tiles/uk-osgb10k1888/{z}/{x}/{y}.jpg?key=${MAPTILER_KEY}`, {
            minZoom: 1, maxZoom: 18, tileSize: 512, zoomOffset: -1, crossOrigin: true,
            attribution: '© National Library of Scotland / MapTiler'
        });

        // Interwar Era (1920s-1940s)
        const nlsInterwar = L.tileLayer(`https://api.maptiler.com/tiles/uk-osgb10k1919/{z}/{x}/{y}.jpg?key=${MAPTILER_KEY}`, {
            minZoom: 1, maxZoom: 18, tileSize: 512, zoomOffset: -1, crossOrigin: true,
            attribution: '© National Library of Scotland / MapTiler'
        });

        // Post-War Era (1950s-1960s National Grid)
        const nlsPostWar = L.tileLayer(`https://api.maptiler.com/tiles/uk-osgb63k1955/{z}/{x}/{y}.jpg?key=${MAPTILER_KEY}`, {
            minZoom: 1, maxZoom: 18, tileSize: 512, zoomOffset: -1, crossOrigin: true,
            attribution: '© National Library of Scotland / MapTiler'
        });

        // --- 3. INITIALIZE INSTANCE ---
        const map = L.map('map', {
            center: [50.26055, -5.05336], 
            zoom: 14, 
            layers: [modernOSM]
        });
        
        let activeMarker = null;

        // --- 4. LAYER INTERFACE CONTROL PANEL ---
        const baseMaps = {
            "Modern Street Map": modernOSM,
            "NLS Victorian/Edwardian (1888-1913)": nlsVictorian,
            "NLS Interwar Series (1919-1947)": nlsInterwar,
            "NLS Post-War Series (1955-1961)": nlsPostWar
        };

        L.control.layers(baseMaps, {}, { collapsed: false }).addTo(map);

        // --- 5. TELEMETRY MONITOR SYSTEM ---
        function updateZoomMonitor() {
            const currentZoom = map.getZoom();
            const zoomDisplay = document.getElementById('zoomValue');
            if (zoomDisplay) {
                zoomDisplay.innerHTML = `Z-LVL ${currentZoom}`;
            }
        }

        map.on('zoomend', updateZoomMonitor);
        map.on('moveend', updateZoomMonitor);
        updateZoomMonitor();

        // --- 6. SECURE GEOLOCATOR STRING DATA PARSER ---
        async function executeDirectGeocode() {
            const query = document.getElementById('targetQuery').value.trim();
            if (!query) return;

            logToTerminal(`Initiating geocode sweep for: "${query}"`);
            const sidebar = document.getElementById('telemetryOutput');
            sidebar.innerHTML = '<p style="font-size: 11px; color: #71717a; margin-top: 8px;">Processing array payload...</p>';

            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=gb`);
                const data = await response.json();

                if (!data || data.length === 0) {
                    logToTerminal("FAILED: Target location context dropped out of index.");
                    sidebar.innerHTML = '<p style="font-size: 11px; color: #e11d48; margin-top: 8px;">Target Context Lost.</p>';
                    return;
                }

                const target = data;
                let lat = parseFloat(target.lat);
                let lon = parseFloat(target.lon);

                if (isNaN(lat) || isNaN(lon)) {
                    logToTerminal("ERROR: Geocoder parsed an empty float coordinate object.");
                    sidebar.innerHTML = '<p style="font-size: 11px; color: #e11d48; margin-top: 8px;">Parsing Float Exception.</p>';
                    return;
                }

                logToTerminal(`SUCCESS: Formatted coords resolved: ${lat.toFixed(5)}, ${lon.toFixed(5)}`);
                map.setView([lat, lon], 15);

                if (activeMarker) map.removeLayer(activeMarker);
                activeMarker = L.marker([lat, lon]).addTo(map);

                sidebar.innerHTML = `
                    <div class="location-card">
                        <strong style="color: #e11d48; font-size: 11px;">[NODE RESOLVED]</strong>
                        <p style="margin: 6px 0; color: #f4f4f5;">${target.display_name}</p>
                        <span style="color: #71717a; font-size: 11px;">Lat/Lon: ${lat.toFixed(5)}, ${lon.toFixed(5)}</span>
                    </div>
                `;

            } catch (err) {
                logToTerminal(`Direct Search Exception: ${err.message}`);
                sidebar.innerHTML = `<p style="font-size: 11px; color: #e11d48; margin-top: 8px;">System Exception Error</p>`;
            }
        }
    </script>
</body>
</html>
