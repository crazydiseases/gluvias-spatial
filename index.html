<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spatial Intercept Deck</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
        body { background-color: #09090b; color: #f4f4f5; display: flex; height: 100vh; overflow: hidden; }
        #controlDeck { width: 360px; background-color: #18181b; border-right: 1px solid #27272a; display: flex; flex-direction: column; padding: 16px; }
        #map { flex-grow: 1; height: 100%; background: #09090b; }
        .deck-title { font-size: 14px; font-weight: bold; color: #e11d48; margin-bottom: 12px; letter-spacing: 1px; }
        .search-container { display: flex; gap: 8px; margin-bottom: 16px; }
        input { flex-grow: 1; background: #09090b; border: 1px solid #27272a; padding: 8px; color: #f4f4f5; font-size: 12px; outline: none; }
        input:focus { border-color: #e11d48; }
        button { background: #e11d48; color: white; border: none; padding: 8px 16px; font-size: 12px; cursor: pointer; font-weight: bold; }
        button:hover { background: #be123c; }
        #telemetryOutput { flex-grow: 1; overflow-y: auto; background: #09090b; border: 1px solid #27272a; padding: 12px; margin-bottom: 16px; }
        #debugWindow { height: 120px; background: #000; border: 1px solid #27272a; padding: 8px; font-size: 10px; color: #22c55e; overflow-y: auto; white-space: pre-wrap; }
        .location-card { border-left: 2px solid #e11d48; padding-left: 8px; margin-bottom: 8px; }
        .leaflet-control-layers { background: #18181b !important; color: #f4f4f5 !important; border: 1px solid #27272a !important; font-family: monospace !important; font-size: 11px !important; }
        .leaflet-control-layers-toggle { background-color: #27272a !important; }
    </style>
</head>
<body>

    <div id="controlDeck">
        <div class="deck-title">// SPATIAL INTERCEPT CORE</div>
        <div class="search-container">
            <input type="text" id="targetQuery" placeholder="Enter coordinates, postcode or area..." onkeydown="if(event.key==='Enter') executeGeocodeSearch()">
            <button onclick="executeGeocodeSearch()">SEEK</button>
        </div>
        <div id="telemetryOutput">
            <p style="font-size: 11px; color: #71717a;">System standby. Ready for execution parameters.</p>
        </div>
        <div id="debugWindow">[SYSTEM READY] Initialization handshake clean.</div>
    </div>

    <div id="map"></div>

    <script>
        function logToTerminal(msg) {
            const logger = document.getElementById('debugWindow');
            if (logger) {
                const time = new Date().toISOString().split('T').slice(0, 8);
                logger.innerText += `\n${time} [TUNNEL CORE] ${msg}`;
                logger.scrollTop = logger.scrollHeight;
            }
        }

        // --- BASE MAP LAYERS ---
        const modernOSM = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { 
            maxZoom: 19, attribution: '© OpenStreetMap'
        });

        // FIXED NLS ENDPOINTS: Added standard TMS flag inversion to resolve image coordinates
        const nlsPopular = L.tileLayer('https://geo.nls.uk/maps/os/gb/{z}/{x}/{y}.png', {
            minZoom: 1, maxZoom: 18, attribution: 'NLS 1920-1940 OS', opacity: 0.85, tms: true
        });

        const nlsPostWar = L.tileLayer('https://geo.nls.uk/maps/os/gb-one-inch-7th/{z}/{x}/{y}.png', {
            minZoom: 1, maxZoom: 18, attribution: 'NLS OS 1950-1960', opacity: 0.85, tms: true
        });

        const nlsBartholomew = L.tileLayer('https://geo.nls.uk/maps/bartholomew/gb/{z}/{x}/{y}.png', {
            minZoom: 1, maxZoom: 18, attribution: 'NLS Bartholomew 1900s', opacity: 0.85, tms: true
        });

        // --- MAP INITIALIZATION ---
        const map = L.map('map', {
            center: [50.15, -5.07], zoom: 13, layers: [modernOSM] 
        });
        
        let activeMarker = null;

        // --- LIVE LAND REGISTRY DATA LAYER ---
        const boundaryLayer = L.geoJSON(null, {
            style: function() {
                return { color: '#e11d48', weight: 2, fillOpacity: 0.2 }; // Strong bright red outlines
            },
            onEachFeature: function(feature, layer) {
                if (feature.properties && feature.properties.INSPIREID) {
                    layer.bindPopup(`<strong>Land Registry ID:</strong> ${feature.properties.INSPIREID}`);
                }
            }
        }).addTo(map);

        // --- LAYER DECK CONTROLLER ---
        const baseMaps = {
            "Modern Street Map": modernOSM,
            "NLS OS Historic (1920-1940)": nlsPopular,
            "NLS Post-War OS (1950-1960)": nlsPostWar,
            "NLS Bartholomew (1900s)": nlsBartholomew
        };

        const overlayMaps = {
            "Live Land Registry Plots": boundaryLayer
        };

        L.control.layers(baseMaps, overlayMaps, { collapsed: false }).addTo(map);

        // --- TRIGGER PIPELINE ON ZOOM / PAN ---
        async function fetchLivePropertyBoundaries() {
            if (!map.hasLayer(boundaryLayer)) return;
            
            // FIXED ZOOM GATE: Allowed data downloading from a much higher altitude view
            if (map.getZoom() < 10) {
                logToTerminal("Zoom in closer (Level 10+) to download parcel vectors.");
                return;
            }

            const bounds = map.getBounds();
            const bboxStr = `${bounds.getWest()},${bounds.getSouth()},${bounds.getEast()},${bounds.getNorth()}`;
            
            try {
                const res = await fetch(`/api/boundaries?bbox=${bboxStr}`);
                const data = await res.json();
                
                if (data && data.features) {
                    boundaryLayer.clearLayers();
                    boundaryLayer.addData(data);
                    logToTerminal(`Injected ${data.features.length} freehold title vectors.`);
                }
            } catch (err) {
                console.error("Boundary error:", err);
            }
        }

        map.on('moveend', fetchLivePropertyBoundaries);
        map.on('overlayadd', function(e) {
            if (e.name === "Live Land Registry Plots") fetchLivePropertyBoundaries();
        });

        // --- GEOCODE SEARCH LOGIC ENGINE ---
        async function executeGeocodeSearch() {
            const query = document.getElementById('targetQuery').value.trim();
            if (!query) return;

            logToTerminal(`Routing spatial intercept query: "${query}"`);
            const sidebar = document.getElementById('telemetryOutput');
            sidebar.innerHTML = '<p style="font-size: 11px; color: #71717a; margin-top: 8px;">Intercepting telemetry points...</p>';

            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(query)}&_nocache=${Date.now()}`);
                const rawText = await response.text();
                
                let parsedData = JSON.parse(rawText);
                if (typeof parsedData === 'string') parsedData = JSON.parse(parsedData);

                let target = parsedData;
                if (typeof target.shift === 'function') target = target.shift();
                if (target && typeof target.shift === 'function') target = target.shift();

                if (!target || typeof target !== 'object' || !target.hasOwnProperty('lat')) {
                    sidebar.innerHTML = '<p style="font-size: 11px; color: #e11d48; margin-top: 8px;">Location context dropped by core directory.</p>';
                    return;
                }

                let lat = Number(target.lat);
                let lon = Number(target.lon);

                logToTerminal(`Coordinates resolved. Fixed on target: ${lat.toFixed(5)}, ${lon.toFixed(5)}`);
                
                try {
                    map.flyTo([lat, lon], 16, { animate: true, duration: 1.5 });
                } catch (mapErr) {
                    map.setView([lat, lon], 16); 
                }

                if (activeMarker) map.removeLayer(activeMarker);
                activeMarker = L.marker([lat, lon]).addTo(map);

                sidebar.innerHTML = `
                    <div class="location-card">
                        <strong style="color: #e11d48; font-size: 11px;">[RESOLVED NODE]</strong>
                        <p style="margin: 6px 0; color: #f4f4f5;">${target.display_name || query}</p>
                        <span style="color: #71717a; font-size: 11px;">Vectors: ${lat.toFixed(5)}, ${lon.toFixed(5)}</span>
                    </div>
                `;
                
                setTimeout(fetchLivePropertyBoundaries, 1600);

            } catch (err) {
                console.error("Extraction Error:", err);
                sidebar.innerHTML = `<p style="font-size: 11px; color: #e11d48; margin-top: 8px;">System Exception Error</p>`;
            }
        }
    </script>
