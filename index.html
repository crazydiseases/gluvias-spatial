<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historical Intercept Deck v10.0</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
        body { background-color: #09090b; color: #f4f4f5; display: flex; height: 100vh; overflow: hidden; }
        #controlDeck { width: 360px; background-color: #18181b; border-right: 1px solid #27272a; display: flex; flex-direction: column; padding: 16px; }
        #map { flex-grow: 1; height: 100%; background: #09090b; }
        .deck-title { font-size: 14px; font-weight: bold; color: #e11d48; margin-bottom: 12px; letter-spacing: 1px; }
        .search-container { display: flex; gap: 8px; margin-bottom: 16px; }
        input { flex-grow: 1; background: #09090b; border: 1px solid #27272a; padding: 8px; color: #f4f4f5; font-size: 12px; outline: none; }
        input:focus { border-color: #e11d48; }
        button { background: #e11d48; color: white; border: none; padding: 8px 16px; font-size: 12px; cursor: pointer; font-weight: bold; }
        button:hover { background: #be123c; }
        #telemetryOutput { flex-grow: 1; overflow-y: auto; background: #09090b; border: 1px solid #27272a; padding: 12px; margin-bottom: 16px; }
        #debugWindow { height: 120px; background: #000; border: 1px solid #27272a; padding: 8px; font-size: 10px; color: #22c55e; overflow-y: auto; white-space: pre-wrap; }
        .location-card { border-left: 2px solid #e11d48; padding-left: 8px; margin-bottom: 8px; }
        .leaflet-control-layers { background: #18181b !important; color: #f4f4f5 !important; border: 1px solid #27272a !important; font-family: monospace !important; font-size: 11px !important; }
    </style>
</head>
<body>

    <div id="controlDeck">
        <div class="deck-title">// SPATIAL INTERCEPT CORE v10</div>
        <div class="search-container">
            <input type="text" id="targetQuery" placeholder="Enter postcode or town..." onkeydown="if(event.key==='Enter') executeGeocodeSearch()">
            <button onclick="executeGeocodeSearch()">SEEK</button>
        </div>
        <div id="telemetryOutput">
            <p style="font-size: 11px; color: #71717a;">System core initialized. Fast-parsing loops armed.</p>
        </div>
        <div id="debugWindow">[SYSTEM READY] V10 Unpacking Loop Online.</div>
    </div>

    <div id="map"></div>

    <script>
        function logToTerminal(msg) {
            const logger = document.getElementById('debugWindow');
            if (logger) {
                const time = new Date().toISOString().split('T').slice(0, 8);
                logger.innerText += `\n${time} [CORE] ${msg}`;
                logger.scrollTop = logger.scrollHeight;
            }
        }

        // =========================================================
        // INSERT YOUR MAPTILER API KEY IN THE QUOTES BELOW:
        const MAPTILER_KEY = "PASTE_YOUR_MAPTILER_API_KEY_HERE";
        // =========================================================

        // --- HISTORICAL MAP BASE TILES ---
        const nlsSixInch = L.tileLayer(`https://api.maptiler.com/tiles/uk-baire10k1900/{z}/{x}/{y}.jpg?key=${MAPTILER_KEY}`, {
            minZoom: 1, maxZoom: 18, attribution: '© National Library of Scotland / MapTiler'
        });

        const nlsPostWar = L.tileLayer(`https://api.maptiler.com/tiles/uk-baire63k1955/{z}/{x}/{y}.jpg?key=${MAPTILER_KEY}`, {
            minZoom: 1, maxZoom: 18, attribution: '© National Library of Scotland / MapTiler'
        });

        const modernOSM = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { 
            maxZoom: 19, attribution: '© OpenStreetMap'
        });

        // --- INITIALIZE MAP CONTAINER ---
        const map = L.map('map', {
            center: [50.26055, -5.05336], zoom: 14, layers: [nlsSixInch] 
        });
        
        let activeMarker = null;

        // --- DYNAMIC HM LAND REGISTRY WMS (PROJECTION SECURED) ---
        const landRegistryWMS = L.tileLayer.wms('https://inspire.landregistry.gov.uk/inspire/ows/ows', {
            layers: 'inspire:INSPIRE_INDEX_POLYGONS',
            format: 'image/png',
            transparent: true,
            version: '1.3.0',
            crs: L.CRS.EPSG4326,
            attribution: 'Contains HM Land Registry data © Crown copyright',
            maxZoom: 22,
            opacity: 0.65
        }).addTo(map);

        // --- LAYER CONTROLLERS ---
        const baseMaps = {
            "NLS Historic Detailed Six-Inch (1888-1913)": nlsSixInch,
            "NLS Post-War One-Inch (1955-1961)": nlsPostWar,
            "Modern Street Map Reference": modernOSM
        };

        const overlayMaps = {
            "Live Land Registry Plots": landRegistryWMS
        };

        L.control.layers(baseMaps, overlayMaps, { collapsed: false }).addTo(map);

        // Monitor map zoom variations
        map.on('moveend', function() {
            if (map.hasLayer(landRegistryWMS) && map.getZoom() < 16) {
                logToTerminal("NOTICE: Land Registry lines require Zoom Level 16+ to render.");
            }
        });

        // --- ROBUST UNPACKING SEARCH PARSER ---
        async function executeGeocodeSearch() {
            const query = document.getElementById('targetQuery').value.trim();
            if (!query) return;

            logToTerminal(`Routing search query: "${query}"`);
            const sidebar = document.getElementById('telemetryOutput');
            sidebar.innerHTML = '<p style
