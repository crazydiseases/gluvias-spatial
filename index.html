<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spatial Intercept Deck v5.0</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://nls.tileserver.com/api.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
        body { background-color: #09090b; color: #f4f4f5; display: flex; height: 100vh; overflow: hidden; }
        #controlDeck { width: 360px; background-color: #18181b; border-right: 1px solid #27272a; display: flex; flex-direction: column; padding: 16px; }
        #map { flex-grow: 1; height: 100%; background: #09090b; }
        .deck-title { font-size: 14px; font-weight: bold; color: #e11d48; margin-bottom: 12px; letter-spacing: 1px; }
        .search-container { display: flex; gap: 8px; margin-bottom: 16px; }
        input { flex-grow: 1; background: #09090b; border: 1px solid #27272a; padding: 8px; color: #f4f4f5; font-size: 12px; outline: none; }
        input:focus { border-color: #e11d48; }
        button { background: #e11d48; color: white; border: none; padding: 8px 16px; font-size: 12px; cursor: pointer; font-weight: bold; }
        button:hover { background: #be123c; }
        #telemetryOutput { flex-grow: 1; overflow-y: auto; background: #09090b; border: 1px solid #27272a; padding: 12px; margin-bottom: 16px; }
        #debugWindow { height: 120px; background: #000; border: 1px solid #27272a; padding: 8px; font-size: 10px; color: #22c55e; overflow-y: auto; white-space: pre-wrap; }
        .location-card { border-left: 2px solid #e11d48; padding-left: 8px; margin-bottom: 8px; }
        .leaflet-control-layers { background: #18181b !important; color: #f4f4f5 !important; border: 1px solid #27272a !important; font-family: monospace !important; font-size: 11px !important; }
        .leaflet-control-layers-toggle { background-color: #27272a !important; }
    </style>
</head>
<body>

    <div id="controlDeck">
        <div class="deck-title">// SPATIAL INTERCEPT CORE v5</div>
        <div class="search-container">
            <input type="text" id="targetQuery" placeholder="Enter postcode or area (e.g. TR1 2NS)..." onkeydown="if(event.key==='Enter') executeGeocodeSearch()">
            <button onclick="executeGeocodeSearch()">SEEK</button>
        </div>
        <div id="telemetryOutput">
            <p style="font-size: 11px; color: #71717a;">System standby. Ready for execution parameters.</p>
        </div>
        <div id="debugWindow">[SYSTEM READY] V5 Dynamic Pipeline Assembled.</div>
    </div>

    <div id="map"></div>

    <script>
        function logToTerminal(msg) {
            const logger = document.getElementById('debugWindow');
            if (logger) {
                const time = new Date().toISOString().split('T').slice(0, 8);
                logger.innerText += `\n${time} [TUNNEL CORE] ${msg}`;
                logger.scrollTop = logger.scrollHeight;
            }
        }

        // --- BASE MAP LAYERS ---
        const modernOSM = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { 
            maxZoom: 19, attribution: '© OpenStreetMap'
        });

        // Safe, clean injection string running through the official public API loader
        const nlsHistoricOS = L.tileLayer('https://nls.tileserver.com/nls/{z}/{x}/{y}.jpg', {
            minZoom: 1, maxZoom: 18, 
            attribution: 'Historic Maps courtesy of National Library of Scotland'
        });

        // --- MAP INITIALIZATION ---
        const map = L.map('map', {
            center: [50.26055, -5.05336], zoom: 15, layers: [modernOSM] 
        });
        
        let activeMarker = null;

        // --- LIVE LAND REGISTRY DATA LAYER ---
        const boundaryLayer = L.geoJSON(null, {
            style: function() {
                return { color: '#e11d48', weight: 3, fillOpacity: 0.2 };
            },
            onEachFeature: function(feature, layer) {
                if (feature.properties && feature.properties.INSPIREID) {
                    layer.bindPopup(`<strong>Land Registry ID:</strong> ${feature.properties.INSPIREID}`);
                }
            }
        }).addTo(map);

        // --- LAYER DECK CONTROLLER ---
        const baseMaps = {
            "Modern Street Map": modernOSM,
            "NLS OS Historic (1920-1947)": nlsHistoricOS
        };

        const overlayMaps = {
            "Live Land Registry Plots": boundaryLayer
        };

        L.control.layers(baseMaps, overlayMaps, { collapsed: false }).addTo(map);

        // --- FIXED FORCED TRIGGER EXTRACTION PIPELINE ---
        async function forceFetchPropertyBoundaries() {
            // Check if the layer exists on the map structure
            const activeLayers = [];
            map.eachLayer(function(l) { activeLayers.push(l); });
            
            // Allow querying across zoom levels
            if (map.getZoom() < 12) {
                logToTerminal("Zoom in closer to download parcel vectors.");
                return;
            }

            const bounds = map.getBounds();
            const bboxStr = `${bounds.getWest()},${bounds.getSouth()},${bounds.getEast()},${bounds.getNorth()}`;
            
            logToTerminal("Extracting live Land Registry vectors...");
            
            try {
                const res = await fetch(`/api/boundaries?bbox=${bboxStr}&_cb=${Date.now()}`);
                const data = await res.json();
                
                if (data && data.features && data.features.length > 0) {
                    boundaryLayer.clearLayers();
                    boundaryLayer.addData(data);
                    logToTerminal(`SUCCESS: Rendered ${data.features.length} plot assets inside window.`);
                } else {
                    logToTerminal("No property polygons returned for this sector.");
                }
            } catch (err) {
                logToTerminal(`Pipeline Error: ${err.message}`);
            }
        }

        // Bind directly to movement actions to bypass toggle detection bugs
        map.on('moveend', forceFetchPropertyBoundaries);

        // --- GEOCODE SEARCH LOGIC ENGINE ---
        async function executeGeocodeSearch() {
            const query = document.getElementById('targetQuery').value.trim();
            if (!query) return;

            logToTerminal(`Routing search query: "${query}"`);
            const sidebar = document.getElementById('telemetryOutput');
            sidebar.innerHTML = '<p style="font-size: 11px; color: #71717a; margin-top: 8px;">Intercepting coordinates...</p>';

            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(query)}&_cb=${Date.now()}`);
                const rawText = await response.text();
                
                let parsedData = JSON.parse(rawText);
                if (typeof parsedData === 'string') parsedData = JSON.parse(parsedData);

                let target = parsedData;
                if (typeof target.shift === 'function') target = target.shift();

                if (!target || typeof target !== 'object' || !target.hasOwnProperty('lat')) {
                    sidebar.innerHTML = '<p style="font-size: 11px; color: #e11d48; margin-top: 8px;">Location dropped by directory.</p>';
                    return;
                }

                let lat = Number(target.lat);
                let lon = Number(target.lon);

                logToTerminal(`Resolved target coordinates: ${lat.toFixed(5)}, ${lon.toFixed(5)}`);
                
                map.setView([lat, lon], 16); 

                if (activeMarker) map.removeLayer(activeMarker);
                activeMarker = L.marker([lat, lon]).addTo(map);

                sidebar.innerHTML = `
                    <div class="location-card">
                        <strong style="color: #e11d48; font-size: 11px;">[NODE RESOLVED]</strong>
                        <p style="margin: 6px 0; color: #f4f4f5;">${target.display_name || query}</p>
                        <span style="color: #71717a; font-size: 11px;">Lat/Lon: ${lat.toFixed(5)}, ${lon.toFixed(5)}</span>
                    </div>
                `;
                
                // Fire the fetch immediately after moving to the target location
                setTimeout(forceFetchPropertyBoundaries, 1000);

            } catch (err) {
                console.error("Extraction Error:", err);
                sidebar.innerHTML = `<p style="font-size: 11px; color: #e11d48; margin-top: 8px;">System Exception Error</p>`;
            }
        }

        // Initialize search map layout with an initial fetch trigger
        setTimeout(forceFetchPropertyBoundaries, 1500);
    </script>
</body>
</html>
