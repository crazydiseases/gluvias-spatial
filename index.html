<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLUVIAS // INTELLIGENCE CORE</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; }
        body { 
            background-color: #050507; 
            color: #a1a1aa; 
            font-family: monospace; 
            margin: 0; 
            padding: 0; 
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .nav-deck { 
            display: flex; 
            align-items: center; 
            background: #0d0f14; 
            border-bottom: 1px solid #8b1e1e; 
            padding: 14px 24px; 
            height: 50px;
        }
        .nav-item { color: #71717a; font-weight: bold; font-size: 13px; letter-spacing: 1px; }
        .nav-item.active { color: #e11d48; }
        .session-anchor { margin-left: auto; color: #e11d48; border: 1px solid #8b1e1e; padding: 4px 12px; font-size: 11px; text-transform: uppercase; font-weight: bold; }

        .workspace-container { display: flex; flex: 1; height: calc(100vh - 170px); }
        #map { flex: 1.3; height: 100%; background: #0d0f14; }
        .side-panel { flex: 0.7; background: #0d0f14; border-left: 1px solid #18181b; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
        .section-title { font-size: 11px; color: #71717a; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #27272a; padding-bottom: 6px; margin: 0; }
        
        .search-block { display: flex; gap: 8px; margin-top: 8px; }
        .console-input { flex: 1; background: #050507; border: 1px solid #27272a; color: #f4f4f5; padding: 10px; font-family: monospace; font-size: 12px; outline: none; }
        .console-button { background: #8b1e1e; color: #f4f4f5; border: none; padding: 0 16px; font-family: monospace; font-weight: bold; font-size: 11px; cursor: pointer; }
        .console-button:hover { background: #e11d48; }

        .location-card { background: #050507; border: 1px solid #27272a; padding: 12px; margin-top: 8px; font-size: 12px; line-height: 1.4; }
        .debug-panel { height: 120px; background: #000000; border-top: 1px solid #27272a; border-left: 3px solid #8b1e1e; padding: 12px; color: #f4f4f5; font-size: 12px; overflow-y: auto; font-family: monospace; white-space: pre-wrap; }
    </style>
</head>
<body>

    <div class="nav-deck">
        <span class="nav-item active">[SPATIAL MAPS //]</span>
        <div class="session-anchor">Proxy Vector Active</div>
    </div>

    <div class="workspace-container">
        <div id="map"></div>
        <div class="side-panel">
            <div>
                <h3 class="section-title">Spatial Target Control</h3>
                <div class="search-block">
                    <input type="text" id="targetQuery" class="console-input" placeholder="Enter postcode or place name..." onkeydown="if(event.key === 'Enter') executeGeocodeSearch()">
                    <button onclick="executeGeocodeSearch()" class="console-button">EXECUTE</button>
                </div>
            </div>
            <div>
                <h3 class="section-title">Active Route Telemetry</h3>
                <div id="telemetryOutput">
                    <p style="font-size: 11px; color: #52525b; margin-top: 8px;">Awaiting location search parameter deployment...</p>
                </div>
            </div>
        </div>
    </div>

    <div id="debugWindow" class="debug-panel">// System Console Online. Proxy route pathing ready...</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        function logToTerminal(msg) {
            const logger = document.getElementById('debugWindow');
            const time = new Date().toISOString().split('T').slice(0, 8);
            logger.innerText += `\n${time} [PROXY CORE] ${msg}`;
            logger.scrollTop = logger.scrollHeight;
        }

        const map = L.map('map').setView([50.15, -5.07], 13);
        let activeMarker = null;

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
        L.tileLayer('https://nls.tileserver.com/nls/{z}/{x}/{y}.jpg', { maxZoom: 18, opacity: 0.9 }).addTo(map);

        async function executeGeocodeSearch() {
            const query = document.getElementById('targetQuery').value.trim();
            if (!query) return;

            logToTerminal(`Piping lookup via secure server tunnel for: "${query}"`);
            const sidebar = document.getElementById('telemetryOutput');
            sidebar.innerHTML = '<p style="font-size: 11px; color: #71717a; margin-top: 8px;">Tunneling query...</p>';

            try {
                // Querying our own backend internal proxy api
                const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();

                if (!data || data.length === 0 || data.error) {
                    sidebar.innerHTML = '<p style="font-size: 11px; color: #e11d48; margin-top: 8px;">Target context could not be pinpointed.</p>';
                    logToTerminal(`Proxy failed to match coordinates.`);
                    return;
                }

                const target = data;
                const lat = parseFloat(target.lat);
                const lon = parseFloat(target.lon);

                logToTerminal(`Tunnel verified node: ${lat.toFixed(4)}, ${lon.toFixed(4)}`);
                map.flyTo([lat, lon], 14, { animate: true, duration: 1.5 });

                if (activeMarker) map.removeLayer(activeMarker);
                activeMarker = L.marker([lat, lon]).addTo(map);

                sidebar.innerHTML = `
                    <div class="location-card">
                        <strong style="color: #e11d48; font-size: 11px;">[LOCKED TARGET]</strong>
                        <p style="margin: 6px 0; color: #f4f4f5;">${target.display_name}</p>
                        <span style="color: #71717a; font-size: 11px;">Matrix: ${lat.toFixed(5)}, ${lon.toFixed(5)}</span>
                    </div>
                `;
            } catch (err) {
                logToTerminal(`Tunnel crash: ${err.message}`);
                sidebar.innerHTML = `<p style="font-size: 11px; color: #e11d48; margin-top: 8px;">Tunnel Error</p>`;
            }
        }
    </script>
</body>
</html>
